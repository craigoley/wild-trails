<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Wild Trails</title>
    <meta
      name="description"
      content="Find, study, and care for the wildlife of a living landscape"
    />
    <meta name="theme-color" content="#1d3b24" />

    <!-- Open Graph (link unfurl: Slack, iMessage, Discord, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wild Trails" />
    <meta property="og:title" content="Wild Trails" />
    <meta
      property="og:description"
      content="Find, study, and care for the wildlife of a living landscape"
    />
    <meta property="og:url" content="https://wild-trails-lovat.vercel.app/" />
    <meta property="og:image" content="https://wild-trails-lovat.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wild Trails — a naturalist leaf over a deep forest-green field" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wild Trails" />
    <meta
      name="twitter:description"
      content="Find, study, and care for the wildlife of a living landscape"
    />
    <meta name="twitter:image" content="https://wild-trails-lovat.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Wild Trails — a naturalist leaf over a deep forest-green field" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple home-screen / fullscreen (iOS Safari ignores the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wild Trails" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
