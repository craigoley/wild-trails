name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo to lint / test / build.
permissions:
  contents: read

# Cancel superseded runs for the same branch / PR so rapid pushes don't pile up
# runners (the newest commit is the only one whose result matters).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, test and build run as independent parallel checks so each shows its own
  # red/green status and a failure in one doesn't mask the others. Node comes from
  # .nvmrc (the single source of truth, pinned to 24 — see engines in package.json).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # `npm run build` is `tsc && vite build`, so this also gates type errors — no
  # separate typecheck job needed.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # L2 SMOKE — every-PR, platform-independent (NO screenshot baselines). Boots the built
  # app in headless Chromium and checks: the page loads, the canvas mounts + renders (not
  # blank), no console errors, and the HUD DOM is present. Catches hard render breakage +
  # boot JS errors that tsc/vitest can't see. (The visual-regression screenshots are a
  # SEPARATE container-only nightly job — e2e-visual.yml — see e2e/README.md.)
  e2e-smoke:
    name: E2E smoke (L2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
